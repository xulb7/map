<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مَسَار | الواقع المعزز</title>

<!--
  ============================================================
  ملف مستقل تماماً: ar.html
  لا يعدّل على أي ملف من موقعك ولا يعتمد عليه.
  لو ما عجبك احذفيه وخلاص، ما يتأثر شي.
  للتجربة افتحيه من الجوال: https://اسم-موقعك.github.io/ar.html
  (لازم HTTPS، وGitHub Pages يوفره تلقائياً)
  ============================================================
-->

<style>
  :root{
    --bg:#0a0f1c;
    --panel:rgba(10,15,28,.82);
    --line:rgba(148,163,184,.25);
    --green:#10b981;
    --blue:#2563eb;
    --red:#ef4444;
    --text:#f1f5f9;
    --muted:#94a3b8;
  }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden}

  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#05080f}

  .layer{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 14px);
    pointer-events:none}
  .layer > *{pointer-events:auto}

  /* الشريط العلوي */
  .top{display:flex;gap:10px;align-items:center;justify-content:space-between;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:10px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .dest{font-size:15px;font-weight:700;color:var(--green);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .remain{font-size:15px;font-weight:700;white-space:nowrap}
  .remain small{color:var(--muted);font-weight:500;margin-inline-start:4px}

  /* السهم */
  .stage{flex:1;display:flex;align-items:center;justify-content:center;
    perspective:620px;pointer-events:none}
  .floor{width:min(62vw,280px);aspect-ratio:1;
    transform:rotateX(58deg) rotateZ(var(--a,0deg));
    transition:transform .12s linear;filter:drop-shadow(0 14px 18px rgba(0,0,0,.55))}
  .floor svg{width:100%;height:100%;overflow:visible}
  .floor .arrow{fill:var(--green)}
  .floor.off .arrow{fill:#f59e0b}
  .floor .rim{fill:none;stroke:rgba(255,255,255,.9);stroke-width:3;stroke-linejoin:round}

  /* بطاقة التعليمات */
  .bottom{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:14px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .main{font-size:24px;font-weight:800;line-height:1.3}
  .sub{margin-top:4px;font-size:14px;color:var(--muted);min-height:1.3em}
  .note{margin-top:8px;font-size:13px;color:#fbbf24}

  .row{display:flex;gap:10px}
  button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px 16px;
    color:#fff;cursor:pointer;flex:1}
  button:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .b-blue{background:var(--blue)}
  .b-dark{background:rgba(30,41,59,.92);border:1px solid var(--line)}
  .b-green{background:var(--green);color:#04281d}
  .b-red{background:var(--red)}

  /* شاشة البداية والوصول */
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    padding:24px;background:rgba(5,8,15,.92);z-index:10}
  .overlay.show{display:flex}
  .box{max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px}
  .box h1{font-size:26px;color:var(--green)}
  .box p{color:var(--muted);line-height:1.7;font-size:15px}
  .tick{font-size:64px}

  /* أدوات التجربة (احذفي الـ div حقها من الأسفل إذا ما تبينها) */
  #debug{position:fixed;top:calc(env(safe-area-inset-top) + 76px);inset-inline-start:14px;
    display:flex;flex-direction:column;gap:8px;z-index:5}
  #debug button{flex:none;padding:8px 12px;font-size:13px;background:rgba(30,41,59,.92);
    border:1px solid var(--line)}

  @media (prefers-reduced-motion:reduce){.floor{transition:none}}
</style>
</head>
<body>

<video id="cam" autoplay muted playsinline></video>

<!-- شاشة البداية -->
<div class="overlay show" id="startScreen">
  <div class="box">
    <h1>التنقل بالواقع المعزز</h1>
    <p>وجّهي كاميرا الجوال للأمام وامشي مع السهم.<br>
       بنطلب إذن الكاميرا وحساس الاتجاه.</p>
    <button class="b-green" id="startBtn">ابدئي</button>
    <button class="b-dark" id="backBtn0">رجوع للخريطة</button>
  </div>
</div>

<!-- شاشة الوصول -->
<div class="overlay" id="arriveScreen">
  <div class="box">
    <div class="tick">✅</div>
    <h1>وصلتي</h1>
    <p id="arriveName"></p>
    <button class="b-green" id="doneBtn">رجوع للخريطة</button>
  </div>
</div>

<!-- الواجهة -->
<div class="layer" id="ui" hidden>
  <div class="top">
    <div class="dest" id="destName">—</div>
    <div class="remain"><span id="remain">0</span><small>م</small></div>
  </div>

  <div class="stage">
    <div class="floor" id="floor">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <path class="arrow" d="M100 8 L168 96 H126 V186 H74 V96 H32 Z"/>
        <path class="rim"   d="M100 8 L168 96 H126 V186 H74 V96 H32 Z"/>
      </svg>
    </div>
  </div>

  <div class="bottom">
    <div class="card" aria-live="polite">
      <div class="main" id="mainTxt">—</div>
      <div class="sub" id="subTxt"></div>
      <div class="note" id="noteTxt" hidden></div>
    </div>
    <div class="row">
      <button class="b-blue" id="calibBtn">اضبطي الاتجاه</button>
      <button class="b-red" id="endBtn">إنهاء</button>
    </div>
  </div>
</div>

<!-- أدوات التجربة: تتحرك فيها بدون ما تمشين فعلياً -->
<div id="debug" hidden>
  <button id="stepBtn">+ خطوة</button>
</div>

<script>
/* ===================================================================
   1) الإعدادات (غيّري هنا فقط)
   =================================================================== */
const CONFIG = {
  // اسم الوجهة اللي يظهر فوق
  destinationName: 'B-G-14 – وكيلة شؤون المتدربات',

  // المسار بالأمتار على إحداثيات الخريطة:
  //   x يزيد لليمين، y يزيد للأسفل (نفس اتجاه صورة الخريطة)
  //   أول نقطة = مكان الباركود اللي مسحته المتدربة
  //   آخر نقطة = الوجهة
  route: [
    { x: 0,  y: 0  },
    { x: 0,  y: -20 },
    { x: 12, y: -20 },
    { x: 12, y: -34 }
  ],

  // زاوية "فوق الخريطة" بالنسبة للشمال الحقيقي (بالدرجات، مع عقارب الساعة).
  // 0 = فوق الخريطة يعني الشمال. القيمة الدقيقة تنضبط بزر "اضبطي الاتجاه".
  mapNorthOffset: 0,

  // طول الخطوة بالمتر
  strideMeters: 0.7,

  // الصفحة اللي يرجع لها زر "رجوع"
  backUrl: 'index.html',

  // إظهار زر "+ خطوة" للتجربة على اللابتوب أو بدون مشي. خليه false عند الإطلاق
  showDebug: true
};

/* ===================================================================
   2) الحالة
   =================================================================== */
const S = {
  route: CONFIG.route.slice(),
  name: CONFIG.destinationName,
  pos: { ...CONFIG.route[0] },
  idx: 1,                       // رقم النقطة القادمة في المسار
  offset: CONFIG.mapNorthOffset,
  heading: null,                // اتجاه الكاميرا الحقيقي (من الشمال)
  hasCompass: false,
  arrived: false
};

// أمثلة على الربط مع موقعك لاحقاً (اختياري)
window.MasarAR = {
  setRoute(points, name){ S.route = points; S.pos = {...points[0]}; S.idx = 1; S.arrived = false; if(name) S.name = name; },
  setPosition(x, y){ S.pos = {x, y}; },
  setNorthOffset(deg){ S.offset = deg; }
};

/* ===================================================================
   3) أدوات رياضية
   =================================================================== */
const rad2deg = r => r * 180 / Math.PI;
const norm360 = d => ((d % 360) + 360) % 360;
const norm180 = d => { d = norm360(d); return d > 180 ? d - 360 : d; };
// زاوية من "فوق الخريطة" مع عقارب الساعة
const mapBearing = (a, b) => rad2deg(Math.atan2(b.x - a.x, -(b.y - a.y)));
const dist = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);

/* ===================================================================
   4) الحساسات
   =================================================================== */
const $ = id => document.getElementById(id);
let lastCompassAt = 0;

// اتجاه الكاميرا الخلفية من deviceorientation (طريقة W3C المعتمدة، تشتغل والجوال واقف)
function headingFromEuler(alpha, beta, gamma){
  const d = Math.PI / 180;
  const x = (beta  || 0) * d, y = (gamma || 0) * d, z = (alpha || 0) * d;
  const cX = Math.cos(x), cZ = Math.cos(z), sX = Math.sin(x), sY = Math.sin(y), sZ = Math.sin(z), cY = Math.cos(y);
  const Vx = -cZ * sY - sZ * sX * cY;
  const Vy = -sZ * sY + cZ * sX * cY;
  let h = Math.atan(Vx / Vy);
  if (Vy < 0) h += Math.PI; else if (Vx < 0) h += 2 * Math.PI;
  return rad2deg(h);
}

function pushHeading(h){
  lastCompassAt = Date.now();
  S.hasCompass = true;
  if (S.heading === null) { S.heading = h; return; }
  S.heading = norm360(S.heading + norm180(h - S.heading) * 0.18); // تنعيم
}

function onOrientation(e){
  if (typeof e.webkitCompassHeading === 'number') {         // iPhone
    pushHeading(e.webkitCompassHeading);
  } else if (e.alpha !== null && e.alpha !== undefined) {    // Android
    pushHeading(headingFromEuler(e.alpha, e.beta, e.gamma));
  }
}

// عدّاد خطوات بسيط من حساس الحركة
let avg = 9.8, lastStepAt = 0;
function onMotion(e){
  const a = e.accelerationIncludingGravity;
  if (!a) return;
  const m = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
  avg = avg * 0.9 + m * 0.1;
  const now = Date.now();
  if (m - avg > 1.6 && now - lastStepAt > 380) { lastStepAt = now; advance(CONFIG.strideMeters); }
}

// تحريك النقطة على المسار (نفترض إنها تمشي معه)
function advance(meters){
  if (S.arrived) return;
  while (meters > 0 && S.idx < S.route.length) {
    const t = S.route[S.idx];
    const d = dist(S.pos, t);
    if (d <= meters) { S.pos = {...t}; meters -= d; S.idx++; }
    else {
      const k = meters / d;
      S.pos = { x: S.pos.x + (t.x - S.pos.x) * k, y: S.pos.y + (t.y - S.pos.y) * k };
      meters = 0;
    }
  }
  if (S.idx >= S.route.length) arrive();
}

/* ===================================================================
   5) الرسم والتحديث
   =================================================================== */
function remaining(){
  let total = 0, p = S.pos;
  for (let i = S.idx; i < S.route.length; i++) { total += dist(p, S.route[i]); p = S.route[i]; }
  return total;
}

function turnWord(){
  // اتجاه اللفة عند النقطة القادمة
  if (S.idx >= S.route.length - 1) return '';
  const b1 = mapBearing(S.route[S.idx - 1] || S.pos, S.route[S.idx]);
  const b2 = mapBearing(S.route[S.idx], S.route[S.idx + 1]);
  const t = norm180(b2 - b1);
  if (t > 35)  return 'ثم انعطفي يمين';
  if (t < -35) return 'ثم انعطفي يسار';
  return '';
}

function render(){
  if (S.arrived) return;
  const target = S.route[S.idx];
  if (!target) return;

  // وصلت النقطة الحالية؟ روحي للي بعدها
  if (dist(S.pos, target) < 1.2 && S.idx < S.route.length - 1) S.idx++;

  const t = S.route[S.idx];
  const d = dist(S.pos, t);
  const heading = S.heading === null ? S.offset : S.heading;  // بدون بوصلة: السهم يتبع اتجاه الخريطة
  const bearingTrue = mapBearing(S.pos, t) + S.offset;
  const rel = norm180(bearingTrue - heading);

  $('floor').style.setProperty('--a', rel.toFixed(1) + 'deg');
  $('floor').classList.toggle('off', Math.abs(rel) > 25);

  const rem = remaining();
  $('remain').textContent = Math.max(0, Math.round(rem));

  if (Math.abs(rel) > 25) {
    $('mainTxt').textContent = rel > 0 ? 'لفّي يمين' : 'لفّي يسار';
    $('subTxt').textContent  = 'لين يصير السهم للأمام';
  } else {
    $('mainTxt').textContent = 'امشي للأمام';
    $('subTxt').textContent  = (d < 6 && turnWord()) ? `بعد ${Math.round(d)} م ${turnWord()}` : `${Math.round(d)} م`;
  }

  if (rem < 1.5) arrive();
}

function loop(){
  render();
  // تنبيه لو الحساس ما اشتغل
  const note = $('noteTxt');
  const noCompass = !S.hasCompass || Date.now() - lastCompassAt > 3000;
  note.hidden = !noCompass;
  if (noCompass) note.textContent = 'ما وصلنا اتجاه الجوال. تأكدي من إذن الحساس، أو جرّبي من جوال ثاني.';
  requestAnimationFrame(loop);
}

function arrive(){
  if (S.arrived) return;
  S.arrived = true;
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  $('arriveName').textContent = S.name;
  $('arriveScreen').classList.add('show');
}

/* ===================================================================
   6) التشغيل والأذونات
   =================================================================== */
function goBack(){
  stopCamera();
  if (document.referrer && history.length > 1) history.back();
  else location.href = CONFIG.backUrl;
}

function stopCamera(){
  const v = $('cam');
  if (v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
}

async function start(){
  // iPhone يطلب إذن صريح، ولازم يكون من ضغطة زر
  const reqs = [];
  if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission)
    reqs.push(DeviceOrientationEvent.requestPermission());
  if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission)
    reqs.push(DeviceMotionEvent.requestPermission());
  const results = await Promise.all(reqs.map(p => p.catch(() => 'denied')));
  const sensorsOk = results.every(r => r === 'granted');

  window.addEventListener('deviceorientationabsolute', onOrientation, true);
  window.addEventListener('deviceorientation', onOrientation, true);
  window.addEventListener('devicemotion', onMotion, true);

  // الكاميرا
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false
    });
    $('cam').srcObject = stream;
  } catch (err) {
    $('noteTxt').hidden = false;
    $('noteTxt').textContent = 'ما اشتغلت الكاميرا. فعّلي إذن الكاميرا من إعدادات المتصفح، أو ارجعي للخريطة.';
  }

  $('startScreen').classList.remove('show');
  $('ui').hidden = false;
  if (CONFIG.showDebug) $('debug').hidden = false;
  if (!sensorsOk) { $('noteTxt').hidden = false; $('noteTxt').textContent = 'إذن الحساسات مرفوض، السهم ما راح يتبع اتجاهك.'; }
  loop();
}

$('startBtn').onclick = start;
$('backBtn0').onclick = goBack;
$('endBtn').onclick   = goBack;
$('doneBtn').onclick  = goBack;
$('stepBtn').onclick  = () => advance(1);

// اضبطي الاتجاه: وقفي وجهك لجهة المسار واضغطي، يتعدّل الاتجاه
$('calibBtn').onclick = () => {
  if (S.heading === null || S.arrived) return;
  const t = S.route[S.idx];
  S.offset = norm360(S.heading - mapBearing(S.pos, t));
  $('mainTxt').textContent = 'تم ضبط الاتجاه';
};

// يمكنك فتح الصفحة بـ ?offset=90 لتجربة زاوية معينة
const q = new URLSearchParams(location.search);
if (q.has('offset')) S.offset = parseFloat(q.get('offset')) || 0;
</script>
</body>
</html>
